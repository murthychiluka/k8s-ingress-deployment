# .github/workflows/ci-cd.yml
name: Build Push Deploy - 4 Apps

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  AWS_REGION: us-east-1
  IMAGE_TAG:  ${{ github.sha }}

jobs:

  # ─────────────────────────────────────
  # JOB 1: Build and Push All 4 Images
  # Runs in PARALLEL for all 4 apps!
  # ─────────────────────────────────────
  build-and-push:
    name: Build & Push - ${{ matrix.app }}
    runs-on: ubuntu-latest

    strategy:
      matrix:
        include:
          # App name + Dockerfile location
          - app: aws
            dockerfile: ./aws/Dockerfile
            context: ./aws
          - app: azure
            dockerfile: ./azure/Dockerfile
            context: ./azure
          - app: gcp
            dockerfile: ./gcp/Dockerfile
            context: ./gcp
          - app: main
            dockerfile: ./Dockerfile
            context: ./main
      fail-fast: false

    steps:

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Show Info
        run: |
          echo "=================================="
          echo "App        : ${{ matrix.app }}"
          echo "Dockerfile : ${{ matrix.dockerfile }}"
          echo "Image Tag  : ${{ env.IMAGE_TAG }}"
          echo "=================================="

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ env.AWS_REGION }}

      - name: Login to ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker Image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          echo "Building ${{ matrix.app }}..."

          docker build \
            -f ${{ matrix.dockerfile }} \
            -t $ECR_REGISTRY/${{ matrix.app }}:${{ env.IMAGE_TAG }} \
            -t $ECR_REGISTRY/${{ matrix.app }}:latest \
            ${{ matrix.context }}

          echo "Build complete! ✅"

      - name: Push to ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          docker push $ECR_REGISTRY/${{ matrix.app }}:${{ env.IMAGE_TAG }}
          docker push $ECR_REGISTRY/${{ matrix.app }}:latest
          echo "Pushed ${{ matrix.app }} ✅"
          echo "URI: $ECR_REGISTRY/${{ matrix.app }}:${{ env.IMAGE_TAG }}"

      - name: Cleanup
        if: always()
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          docker rmi $ECR_REGISTRY/${{ matrix.app }}:${{ env.IMAGE_TAG }} || true
          docker rmi $ECR_REGISTRY/${{ matrix.app }}:latest || true

  # ─────────────────────────────────────
  # JOB 2: Update All 4 YAML Files
  # ─────────────────────────────────────
  update-manifests:
    name: Update K8s Manifests
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:

      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_TOKEN }}

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ env.AWS_REGION }}

      - name: Login to ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Update All 4 YAML Files
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          echo "Updating all YAML files..."

          for APP in aws azure gcp main; do

            # Check if yaml file exists
            if [ ! -f "${APP}.yaml" ]; then
              echo "${APP}.yaml not found!"
              # Try k8s/ folder
              if [ -f "k8s/${APP}.yaml" ]; then
                YAML_PATH="k8s/${APP}.yaml"
              else
                echo "Skipping ${APP}"
                continue
              fi
            else
              YAML_PATH="${APP}.yaml"
            fi

            echo "Updating ${YAML_PATH}..."

            # Show before
            echo "Before:"
            grep "image:" ${YAML_PATH} || true

            # Update image tag
            sed -i \
              "s|image: .*${APP}:.*|image: $ECR_REGISTRY/${APP}:${{ env.IMAGE_TAG }}|g" \
              ${YAML_PATH}

            # Show after
            echo "After:"
            grep "image:" ${YAML_PATH} || true

            echo "${APP} yaml updated! ✅"
            echo "---"
          done

      - name: Show All Updated Images
        run: |
          echo "=================================="
          echo "UPDATED IMAGE TAGS"
          echo "=================================="
          for APP in aws azure gcp main; do
            for PATH in "${APP}.yaml" "k8s/${APP}.yaml"; do
              if [ -f "${PATH}" ]; then
                echo "=== ${PATH} ==="
                grep "image:" ${PATH} || true
              fi
            done
          done

      - name: Commit and Push
        run: |
          git config user.email "github-actions@github.com"
          git config user.name  "GitHub Actions Bot"

          # Add all yaml files
          git add *.yaml k8s/*.yaml 2>/dev/null || true

          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "ci: update all 4 images to ${{ env.IMAGE_TAG }}

            Images updated:
            - aws:   ECR/aws:${{ env.IMAGE_TAG }}
            - azure: ECR/azure:${{ env.IMAGE_TAG }}
            - gcp:   ECR/gcp:${{ env.IMAGE_TAG }}
            - main:  ECR/main:${{ env.IMAGE_TAG }}

            [skip ci]"

            git push origin main
            echo "All manifests pushed! ✅"
          fi

  # ─────────────────────────────────────
  # JOB 3: Deploy via ArgoCD
  # ─────────────────────────────────────
  deploy:
    name: Deploy via ArgoCD
    needs: update-manifests
    runs-on: ubuntu-latest

    steps:

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ env.AWS_REGION }}

      - name: Install kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'latest'

      - name: Configure kubectl for EKS
        run: |
          aws eks update-kubeconfig \
            --region ${{ env.AWS_REGION }} \
            --name ${{ secrets.EKS_CLUSTER_NAME }}
          kubectl get nodes
          echo "kubectl ready! ✅"

      - name: Install ArgoCD CLI
        run: |
          curl -sSL -o argocd \
            https://github.com/argoproj/argo-cd/releases/latest/download/argocd-linux-amd64
          chmod +x argocd
          sudo mv argocd /usr/local/bin/
          echo "ArgoCD CLI ready! ✅"

      - name: Login to ArgoCD
        run: |
          argocd login \
            ${{ secrets.ARGOCD_SERVER }} \
            --username ${{ secrets.ARGOCD_USERNAME }} \
            --password ${{ secrets.ARGOCD_PASSWORD }} \
            --insecure \
            --grpc-web
          echo "Logged in! ✅"

      - name: Sync All ArgoCD Apps
        run: |
          for APP in aws azure gcp main; do
            echo "Syncing ${APP}-app..."
            argocd app sync ${APP}-app \
              --force \
              --prune \
              --timeout 180 \
              || echo "${APP} sync failed - check ArgoCD UI"
            echo "${APP} sync done! ✅"
          done

      - name: Wait for All Healthy
        run: |
          for APP in aws azure gcp main; do
            echo "Waiting for ${APP}-app..."
            argocd app wait ${APP}-app \
              --health \
              --timeout 300 \
              || echo "${APP} not healthy yet"
          done

      - name: Final Status
        if: always()
        run: |
          echo "=================================="
          echo "DEPLOYMENT STATUS"
          echo "=================================="
          for APP in aws azure gcp main; do
            echo "--- ${APP} ---"
            argocd app get ${APP}-app \
              --output wide \
              2>/dev/null || echo "App not found"
          done
          echo ""
          echo "All Pods:"
          kubectl get pods --all-namespaces | grep -E "aws|azure|gcp|main" || true
