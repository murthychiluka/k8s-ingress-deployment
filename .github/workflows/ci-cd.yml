# .github/workflows/ci-cd.yml

name: CI - Build Push and Update Manifests

on:
  push:
    branches:
      - main

  workflow_dispatch:

# Required for GitHub Actions to commit updated manifests
permissions:
  contents: write

env:
  AWS_REGION: us-east-1
  IMAGE_TAG: ${{ github.sha }}

jobs:

  # ============================================================
  # JOB 1: BUILD AND PUSH ALL APPLICATION IMAGES
  # ============================================================

  build-and-push:

    name: Build & Push - ${{ matrix.app }}

    runs-on: ubuntu-latest

    strategy:
      fail-fast: false

      matrix:
        include:

          - app: aws
            dockerfile: ./aws/Dockerfile
            context: ./aws

          - app: azure
            dockerfile: ./azure/Dockerfile
            context: ./azure

          - app: gcp
            dockerfile: ./gcp/Dockerfile
            context: ./gcp

          - app: main
            dockerfile: ./main/Dockerfile
            context: ./main

    steps:

      # ----------------------------------------------------------
      # Checkout source code
      # ----------------------------------------------------------

      - name: Checkout Code
        uses: actions/checkout@v4


      # ----------------------------------------------------------
      # Configure AWS credentials
      # ----------------------------------------------------------

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}


      # ----------------------------------------------------------
      # Login to ECR
      # ----------------------------------------------------------

      - name: Login to ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2


      # ----------------------------------------------------------
      # Build Docker image
      # ----------------------------------------------------------

      - name: Build Docker Image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}

        run: |

          echo "=========================================="
          echo "Application : ${{ matrix.app }}"
          echo "Dockerfile  : ${{ matrix.dockerfile }}"
          echo "Context     : ${{ matrix.context }}"
          echo "Image Tag   : ${{ env.IMAGE_TAG }}"
          echo "=========================================="

          docker build \
            -f "${{ matrix.dockerfile }}" \
            -t "$ECR_REGISTRY/${{ matrix.app }}:${{ env.IMAGE_TAG }}" \
            -t "$ECR_REGISTRY/${{ matrix.app }}:latest" \
            "${{ matrix.context }}"


      # ----------------------------------------------------------
      # Push image to ECR
      # ----------------------------------------------------------

      - name: Push to ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}

        run: |

          docker push \
            "$ECR_REGISTRY/${{ matrix.app }}:${{ env.IMAGE_TAG }}"

          docker push \
            "$ECR_REGISTRY/${{ matrix.app }}:latest"

          echo "=========================================="
          echo "Successfully pushed:"
          echo "$ECR_REGISTRY/${{ matrix.app }}:${{ env.IMAGE_TAG }}"
          echo "=========================================="


      # ----------------------------------------------------------
      # Cleanup
      # ----------------------------------------------------------

      - name: Cleanup Docker Images
        if: always()

        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}

        run: |

          docker rmi \
            "$ECR_REGISTRY/${{ matrix.app }}:${{ env.IMAGE_TAG }}" \
            || true

          docker rmi \
            "$ECR_REGISTRY/${{ matrix.app }}:latest" \
            || true


  # ============================================================
  # JOB 2: UPDATE KUBERNETES MANIFESTS
  # ============================================================

  update-manifests:

    name: Update Kubernetes Manifests

    needs: build-and-push

    runs-on: ubuntu-latest

    steps:

      # ----------------------------------------------------------
      # Checkout repository
      # ----------------------------------------------------------

      - name: Checkout Code
        uses: actions/checkout@v4


      # ----------------------------------------------------------
      # Update image tags
      # ----------------------------------------------------------

      - name: Update Kubernetes Manifests
        run: |

          echo "=========================================="
          echo "Updating Kubernetes manifests"
          echo "Image Tag: ${{ env.IMAGE_TAG }}"
          echo "=========================================="

          for APP in aws azure gcp main
          do

            YAML_PATH="k8s-files/${APP}.yml"

            echo ""
            echo "------------------------------------------"
            echo "Application : ${APP}"
            echo "Manifest    : ${YAML_PATH}"
            echo "------------------------------------------"

            if [ ! -f "$YAML_PATH" ]; then
              echo "ERROR: $YAML_PATH does not exist!"
              exit 1
            fi

            echo "Before:"
            grep "image:" "$YAML_PATH" || true

            sed -i \
              "s|image: .*${APP}:.*|image: 851725468573.dkr.ecr.${AWS_REGION}.amazonaws.com/${APP}:${IMAGE_TAG}|g" \
              "$YAML_PATH"

            echo "After:"
            grep "image:" "$YAML_PATH" || true

          done


      # ----------------------------------------------------------
      # Commit and push manifest changes
      # ----------------------------------------------------------

      - name: Commit and Push Manifests
        run: |

          git config user.name "GitHub Actions Bot"
          git config user.email "github-actions@github.com"

          git add k8s-files/aws.yml
          git add k8s-files/azure.yml
          git add k8s-files/gcp.yml
          git add k8s-files/main.yml

          if git diff --staged --quiet
          then

            echo "No manifest changes detected."

          else

            git commit \
              -m "ci: update Kubernetes images to ${IMAGE_TAG} [skip ci]"

            git push origin main

            echo "=========================================="
            echo "Manifests pushed successfully."
            echo "=========================================="

          fi