apiVersion: apps/v1
kind: Deployment
metadata:
  name: azure-deployment
  labels: { app: azure }
spec:
  replicas: 2
  selector:
    matchLabels: { app: azure }
  template:
    metadata:
      labels: { app: azure }
    spec:
      containers:
        - name: azure
          image: 851725468573.dkr.ecr.us-east-1.amazonaws.com/azure:aa6721b1e7eca03ecf6629a74d1c9d2169840ce4
          imagePullPolicy: Always
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: azure-service
spec:
  selector: { app: azure }
  ports:
    - port: 80
      targetPort: 80
  type: ClusterIP

